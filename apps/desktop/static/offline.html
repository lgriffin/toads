<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toads Hub: can't reach the hub</title>
    <style>
      :root { color-scheme: dark; --ink: #120f33; --text: #f6f1e5; --muted: #b9b2d6; --gold: #e0b45c; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ink); color: var(--text);
        font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 32rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { color: var(--muted); margin: 0 0 1.5rem; }
      a { display: inline-block; padding: 0.6rem 1.4rem; border-radius: 0.5rem; background: var(--gold); color: var(--ink);
        font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>The pond is out of reach</h1>
      <p>The app can't reach the Toads Hub right now. Check your connection; it tries again by itself once you're back online.</p>
      <a id="retry" href="#">Try again</a>
    </main>
    <script>
      // The page that failed, passed by the app. Only an http(s) address is followed.
      const target = new URLSearchParams(location.search).get('url') || '';
      const retry = document.getElementById('retry');
      if (/^https?:\/\//.test(target)) retry.href = target;
      window.addEventListener('online', () => retry.click());
    </script>
  </body>
</html>
