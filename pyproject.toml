[project]
name = "toads-workspace"
version = "0.0.0"
requires-python = ">=3.12"
description = "Toads Hub workspace root (not published)"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/hub-db", "services/api", "services/worker", "services/bot"]

[tool.uv.sources]
hub-db = { workspace = true }
toads-api = { workspace = true }
toads-worker = { workspace = true }
toads-bot = { workspace = true }
# The analyzer's packages from lgriffin/warcraftlogs_project, all three pinned to the same release (wcl-app and
# wcl-store depend on wcl-core and wcl-store by name). The Analyzer release workflow moves all three to each new
# release; by hand, run `python scripts/analyzer_release.py pin <tag>` and `uv lock` (docs/deploy.md).
wcl-core = { git = "https://github.com/lgriffin/warcraftlogs_project", subdirectory = "packages/wcl-core", tag = "v4.5.0" }
wcl-store = { git = "https://github.com/lgriffin/warcraftlogs_project", subdirectory = "packages/wcl-store", tag = "v4.5.0" }
wcl-app = { git = "https://github.com/lgriffin/warcraftlogs_project", subdirectory = "packages/wcl-app", tag = "v4.5.0" }

[dependency-groups]
dev = [
    "hub-db",
    "toads-api",
    "toads-worker",
    "toads-bot",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-bdd>=7",
    "hypothesis>=6",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "types-PyYAML",
    "fakeredis>=2.26",
    "import-linter>=2.15",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"scripts/**" = ["S101"]
"conftest.py" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = ["packages/hub-db/src", "services/api/src", "services/worker/src", "services/bot/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["rq.*", "discord.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "services/worker/tests", "services/bot/tests", "packages/hub-db/tests", "tests"]
addopts = "--import-mode=importlib"
markers = [
    "security: security controls from the build spec's Security table",
    "ears_ubiquitous: EARS ubiquitous requirement",
    "ears_event_driven: EARS event-driven requirement",
    "ears_state_driven: EARS state-driven requirement",
    "ears_unwanted_behavior: EARS unwanted-behaviour requirement",
    "ears_optional: EARS optional-feature requirement",
    "member: guild member persona",
    "raid_leader: raid leader persona",
    "maintainer: developer / maintainer persona",
]

# Architecture contracts, checked by `lint-imports` in CI (just lint). Frontends and the bot reach the hub only
# through the API; community rules stay free of RBAC, web framework and storage imports.
[tool.importlinter]
root_packages = ["toads_api", "toads_bot", "toads_worker", "hub_db"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The bot talks to the hub only over HTTP: no toads_api or hub_db imports"
type = "forbidden"
source_modules = ["toads_bot"]
forbidden_modules = ["toads_api", "hub_db", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Bot bridge rules hold no RBAC, web framework or storage code"
type = "forbidden"
source_modules = ["toads_api.bots.bridge", "toads_api.bots.models"]
forbidden_modules = ["toads_api.rbac", "fastapi", "starlette", "hub_db", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Bank client, events and messages hold no RBAC, web framework or storage code"
type = "forbidden"
source_modules = ["toads_api.bank.client", "toads_api.bank.events", "toads_api.bank.messages"]
forbidden_modules = ["toads_api.rbac", "fastapi", "starlette", "hub_db", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Bank routes hold no storage code: ToadsBank owns the bank's data"
type = "forbidden"
source_modules = ["toads_api.bank.routes"]
forbidden_modules = ["hub_db", "sqlalchemy"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Bank grant routes reach storage only through the service"
type = "forbidden"
source_modules = ["toads_api.bank_grants.routes"]
forbidden_modules = ["hub_db", "sqlalchemy", "toads_api.bank_grants.sql"]
# Direct imports only: the shared guards (rbac.deps -> audit, services) reach the database for the audit log.
allow_indirect_imports = true

