name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python scripts/dev.py format lint imports reqs types test

  postgres:
    # The community repository and the hub-db migrations against a real Postgres (the other jobs use SQLite).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: toads
          POSTGRES_DB: toads
          POSTGRES_HOST_AUTH_METHOD: trust  # throwaway CI container reachable only from this job
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U toads" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TOADS_TEST_DATABASE_URL: postgresql+psycopg://toads@localhost:5432/toads
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python scripts/dev.py postgres

  backup:
    # The nightly backup and restore scripts against a real Postgres and restic (tests/backup/drill.sh).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python scripts/dev.py shell backup

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python scripts/dev.py security audit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: python3 ../../scripts/dev.py web-check web-test web-build web-audit

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 ../../scripts/dev.py e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, file: services/api/Dockerfile, context: . }
          - { name: worker, file: services/worker/Dockerfile, context: . }
          - { name: bot, file: services/bot/Dockerfile, context: . }
          - { name: web, file: apps/web/Dockerfile, context: apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: toads-${{ matrix.name }}:${{ github.sha }}
      # Every console script in the venv must point at an interpreter that exists in the runtime image.
      - name: Console scripts run in the image
        if: matrix.name != 'web'
        run: |
          docker run --rm --entrypoint sh toads-${{ matrix.name }}:${{ github.sha }} -c '
            for f in /app/.venv/bin/*; do
              [ "$(head -c2 "$f")" = "#!" ] || continue
              interp=$(head -n1 "$f" | cut -c3- | cut -d" " -f1)
              [ -x "$interp" ] || { echo "$f: interpreter $interp is missing"; exit 1; }
            done'
          docker run --rm --entrypoint python toads-${{ matrix.name }}:${{ github.sha }} -c "import sys; print(sys.prefix)"

  ci-success:
    # The one required check: it needs every other job and fails if any failed, was cancelled or was skipped, so a
    # renamed or dropped job turns the PR red instead of silently passing (REQ-DEV-CI-001, scripts/ci_gate.py).
    if: always()
    needs: [python, postgres, backup, security, web, e2e, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci_gate.py
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
