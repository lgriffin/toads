[project]
name = "hub-db"
version = "0.0.0"
description = "Hub-only SQLAlchemy models; analyzer tables come from wcl-store"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "cryptography>=43",
    "sqlalchemy>=2.0",
]

[project.scripts]
hub-db-migrate = "hub_db.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub_db"]
