# Dev profile: `just up`. Staging/prod overrides (real Discord, R2, Caddy TLS) arrive with phase 2.0's release work.
name: toads

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: toads
      POSTGRES_PASSWORD: toads  # dev only
      POSTGRES_DB: toads
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toads"]
      interval: 5s

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:  # R2 stand-in
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: toads
      MINIO_ROOT_PASSWORD: toads-dev-only
    ports: ["9000:9000", "9001:9001"]

  migrate:  # one-shot: applies hub-db's Alembic migrations before the API starts
    build: { context: .., dockerfile: services/api/Dockerfile }
    command: ["hub-db-migrate"]
    env_file: ../services/api/.env
    healthcheck: { disable: true }
    depends_on: { postgres: { condition: service_healthy } }

  analyser-migrate:  # one-shot: applies wcl-store's Alembic migrations (analyzer tables) before the worker starts
    build: { context: .., dockerfile: services/worker/Dockerfile }
    command: ["toads-worker-migrate"]
    env_file: ../services/worker/.env
    healthcheck: { disable: true }
    depends_on: { postgres: { condition: service_healthy } }

  # Dev stand-in for Discord OAuth2 + REST (services/api/src/toads_api/testing/fake_discord.py), so the dev
  # stack needs no Discord application. It signs the browser straight in as the seeded user: dev only,
  # never in staging/prod. services/api/.env.example points the API at it; FAKE_DISCORD_ROLES gives the
  # dev user those role ids (put the same ids in config/raid_days.yaml to sign in as raider or officer).
  fake-discord:
    build: { context: .., dockerfile: services/api/Dockerfile }
    command: ["uvicorn", "--factory", "toads_api.testing.fake_discord:app_from_env", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      FAKE_DISCORD_I_AM_DEV: "1"  # the fake refuses to start without this opt-in
      FAKE_DISCORD_CLIENT_ID: toads-dev
      FAKE_DISCORD_CLIENT_SECRET: replace-me  # matches the placeholder in services/api/.env.example
      FAKE_DISCORD_GUILD_ID: "1"
      FAKE_DISCORD_NICK: Hopscotch
      FAKE_DISCORD_ROLES: ""
    healthcheck: { disable: true }
    ports: ["8081:8001"]  # the browser is redirected to http://localhost:8081/oauth2/authorize

  # Dev stand-in for ToadsBank's toadsbank-api (services/api/src/toads_api/testing/fake_bank.py): one seeded bank,
  # imports, requests and events, all in memory. Dev only; staging and prod point TOADS_BANK_URL at the real service.
  fake-bank:
    build: { context: .., dockerfile: services/api/Dockerfile }
    command: ["uvicorn", "--factory", "toads_api.testing.fake_bank:app_from_env", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      FAKE_BANK_I_AM_DEV: "1"  # the fake refuses to start without this opt-in
      FAKE_BANK_TOKEN: replace-me  # matches TOADS_BANK_SERVICE_TOKEN in services/api/.env.example
      FAKE_BANK_MANAGER: "1001"  # the fake Discord's dev user manages the seeded bank
      FAKE_BANK_RAID_DAY: wed  # the seeded bank belongs to this raid day's officers
      FAKE_BANK_EVENTS_URL: http://api:8000/api/bank/events
    healthcheck: { disable: true }

  api:
    build: { context: .., dockerfile: services/api/Dockerfile }
    env_file: ../services/api/.env
    volumes: [../config:/config:ro]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      migrate: { condition: service_completed_successfully }
      fake-discord: { condition: service_started }  # startup checks raid-day roles against "Discord"
    ports: ["8000:8000"]

  worker:
    build: { context: .., dockerfile: services/worker/Dockerfile }
    env_file: ../services/worker/.env
    volumes: [../config:/config:ro]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      analyser-migrate: { condition: service_completed_successfully }

  # Keeps the hub's analyzer widgets, performance numbers and raid sheets fresh (toads_worker.schedule); intervals
  # come from TOADS_HUB_REFRESH_MINUTES and TOADS_SHEETS_REFRESH_MINUTES in services/worker/.env.
  scheduler:
    build: { context: .., dockerfile: services/worker/Dockerfile }
    command: ["toads-worker", "schedule"]
    env_file: ../services/worker/.env
    volumes: [../config:/config:ro]
    depends_on:
      postgres: { condition: service_healthy }
      analyser-migrate: { condition: service_completed_successfully }
      api: { condition: service_started }

  bot:
    build: { context: .., dockerfile: services/bot/Dockerfile }
    env_file: ../services/bot/.env
    depends_on: [api]
    profiles: [bot]  # needs a real bot token; `docker compose --profile bot up`

  # The guild bank's bot (docs/bank.md). Its own Discord application: set TOADS_DISCORD_BOT_TOKEN and
  # TOADS_BOT_CHANNEL_IDS for it here, not the Toad Bot's.
  bank-bot:
    build: { context: .., dockerfile: services/bot/Dockerfile }
    command: ["toads-botkit"]
    env_file: ../services/bot/.env
    environment:
      TOADS_BOT_SPEC: bank
    depends_on: [api]
    profiles: [bot]

  web:
    build: { context: ../apps/web }
    depends_on: [api]

  caddy:
    image: caddy:2
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro]
    ports: ["8080:8080"]
    depends_on: [web, api]

volumes:
  pgdata:
