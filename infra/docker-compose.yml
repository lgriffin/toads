# Dev profile: `just up`. Staging/prod overrides (real Discord, R2, Caddy TLS) arrive with phase 2.0's release work.
name: toads

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: toads
      POSTGRES_PASSWORD: toads  # dev only
      POSTGRES_DB: toads
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toads"]
      interval: 5s

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:  # R2 stand-in
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: toads
      MINIO_ROOT_PASSWORD: toads-dev-only
    ports: ["9000:9000", "9001:9001"]

  api:
    build: { context: .., dockerfile: services/api/Dockerfile }
    env_file: ../services/api/.env
    volumes: [../config:/config:ro]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    ports: ["8000:8000"]

  worker:
    build: { context: .., dockerfile: services/worker/Dockerfile }
    env_file: ../services/worker/.env
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

  bot:
    build: { context: .., dockerfile: services/bot/Dockerfile }
    env_file: ../services/bot/.env
    depends_on: [api]
    profiles: [bot]  # needs a real bot token; `docker compose --profile bot up`

  web:
    build: { context: ../apps/web }
    depends_on: [api]

  caddy:
    image: caddy:2
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro]
    ports: ["8080:8080"]
    depends_on: [web, api]

volumes:
  pgdata:
