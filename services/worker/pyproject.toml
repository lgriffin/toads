[project]
name = "toads-worker"
version = "0.0.0"
description = "Toads Hub worker: nightly guild sync, analysis via wcl-app, media processing"
requires-python = ">=3.12"
dependencies = [
    "hub-db",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pyyaml>=6",
    "rq>=1.16",
    "redis>=5",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24",
    # The analyzer, pinned by commit in the workspace root's [tool.uv.sources]
    "wcl-core",
    "wcl-app",
    "wcl-store[postgres]",
]

[project.scripts]
toads-worker = "toads_worker.__main__:main"
toads-worker-migrate = "toads_worker.store:migrate_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toads_worker"]
