[project]
name = "toads-worker"
version = "0.0.0"
description = "Toads Hub worker: nightly guild sync, analysis via wcl-core, media processing"
requires-python = ">=3.12"
dependencies = [
    "hub-db",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pyyaml>=6",
    "rq>=1.16",
    "redis>=5",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24",
    "wcl-core",  # pinned by commit in the workspace root's [tool.uv.sources]
    # "wcl-store" -- added once the analyzer's storage split lands (Part 1, phase 1.2)
]

[project.scripts]
toads-worker = "toads_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toads_worker"]
