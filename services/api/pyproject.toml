[project]
name = "toads-api"
version = "0.0.0"
description = "Toads Hub API: auth, RBAC, read endpoints over wcl-store"
requires-python = ">=3.12"
dependencies = [
    "hub-db",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "structlog>=24",
    "httpx>=0.27",
    "redis>=5",
    # Hands reference comparison jobs to the worker's queue.
    "rq>=1.16",
    "psycopg[binary]>=3.2",
    # Re-encodes Discord photos for the Highlights page: strips EXIF (phone GPS) and makes the web and thumbnail sizes.
    "pillow>=11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toads_api"]
