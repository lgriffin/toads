[project]
name = "toads-bot"
version = "0.0.0"
description = "Toad Bot: Discord mirror and slash commands; talks to the Hub API only"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24",
]

[project.scripts]
toads-bot = "toads_bot.__main__:main"
toads-botkit = "toads_bot.kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toads_bot"]
