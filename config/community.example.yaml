# Copy to config/community.yaml (git-ignored) and fill in Discord channel ids. Configuration, not code.
guild: Toads
realm: Spineshatter EU
tagline: A very social raiding guild on the EU PvP side of WoW Forever, locked in on speed and execution.
# The public Story page's words, the first thing a visitor reads. Edit them here and restart the API.
story:
  - "Toads cut its teeth on Classic Fresh on Spineshatter: a social guild that locked in on raid night and took Molten Core, Blackwing Lair, Ahn’Qiraj and Naxxramas with a focus on speed runs."
  - "We carried the same habits into The Burning Crusade, from Karazhan to Black Temple and Mount Hyjal. A balanced raid, full consumes and clean pulls: progression first, then the clock. Every clear is on Warcraft Logs."
  - "World of Warcraft: Forever will follow the same pattern. Two 40-man teams, Wednesday and Sunday, clearing in one night wherever we can, with Discord as the pond in between."
discord_invite: https://discord.gg/toads  # only discord.gg / discord.com/invite links are accepted

# Channels the bot offers to the hub for curation. Nothing from them is shown until an officer publishes it.
# raid_day: null means guild-wide (global officers curate); otherwise that raid day's officers curate.
mirrored_channels: []
#  - { channel_id: 0, raid_day: null }   # announcements
#  - { channel_id: 0, raid_day: wed }

# Where hub posts go when an officer ticks "also post to Discord": "guild" plus one per raid day.
post_channels: {}
#  guild: 0
#  wed: 0

# Category that private interview rooms are created under. Step-by-step setup: docs/discord-setup.md.
interview_category_id: null

# Officers who interview every applicant: Discord user ids (safest: right-click them > Copy User ID) or usernames
# (not nicknames; a username someone gives up can be claimed by another member). When set, the Toad Bot opens the
# interview room as soon as someone applies, with only the applicant and these people in it. Leave empty to have
# officers open rooms by hand, for the officers of the days applied for.
interviewers: []
#  - _gallagher
#  - hadur117
