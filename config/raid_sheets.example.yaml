# Copy to config/raid_sheets.yaml (git-ignored). The guild's weekly raid spreadsheets, imported read-only by the
# worker and attached to the raid each tab describes. Nothing is ever written back to the sheets.
#
# CBA is shariva's Combat Log Analytics sheet and RPB the Role Performance Breakdown: each is re-run every week for
# one Warcraft Logs report. CBA tabs carry the report's date, so they are linked by that date and the raid day:
# `raid_day` when the spreadsheet only ever covers one day, else the day whose weekday matches the date. RPB tabs
# carry no date, so `follows: cba` puts new RPB content on the latest CBA raid from the week before the download.
#
# `tabs` lists the tabs to keep. Without it every tab is kept except the templates' setup tabs (Instructions,
# trans, *config*), which hold the runner's Discord webhook, e-mail and API key. Webhooks and e-mails anywhere else
# are blanked before storing.
#
# The worker downloads through Google's export link, so each sheet must be shared as "Anyone with the link: Viewer".
sources:
  - kind: cba
    spreadsheet_id: 1ua81-yeWdU1eW4ziHP2EF-1rxrSILbRWjmvZG9eLpkM
    title: CBA
    tabs: [buff consumables, gear issues, gear listing, drums, validate, fights, "shadow resi (*"]
  - kind: rpb
    spreadsheet_id: 1OTZF3PHYtx3h_ENlV5cN2aUylnIe7keS-SzFnun_CcU
    title: RPB
    follows: cba
    tabs: [general, "caster*", "healer*", "physical*", "tank*"]

# Weekday per raid day (0 = Monday). Days left out use the weekday in their name in raid_days.yaml.
weekdays: {}
#  wed: 2
#  sun: 6
